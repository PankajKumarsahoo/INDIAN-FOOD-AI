
services:

  food-nutrition-api:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: indian-food-ai-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./models:/app/models:ro

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health

      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
