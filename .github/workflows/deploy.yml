
name: Indian Food AI - CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indian-food-ai-production
  cancel-in-progress: false

jobs:
  test:
    name: Test and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch pytest

      - name: Run Python syntax validation
        run: |
          python -m compileall -q api foodai scripts predict.py

      - name: Run unit tests
        run: |
          pytest -q tests/

  deploy:
    name: Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application and restart server
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" << EOF

            set -e

            echo "Starting Indian Food AI deployment..."

            cd "$DEPLOY_PATH"

            echo "Fetching latest GitHub changes..."
            git fetch origin main
            git reset --hard origin/main

            echo "Downloading Git LFS models..."
            git lfs pull

            echo "Building and restarting Docker application..."
            docker compose up -d --build --force-recreate

            echo "Checking running containers..."
            docker compose ps

            echo "Checking API health..."
            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:8000/health; then
                echo "Deployment successful!"
                exit 0
              fi
              sleep 10
            done

            echo "API health check failed!"
            docker compose logs --tail=100
            exit 1

          EOF

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
